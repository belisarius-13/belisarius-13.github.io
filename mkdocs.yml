site_name: BELISARIUS13
site_description: Purple Team Security Engineering, Detection Engineering, DFIR and Cloud Security
site_author: Joseph Daniel
site_url: https://belisarius13.com

theme:
  name: material
  language: en

  palette:
    - scheme: slate
      primary: deep purple
      accent: purple

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md

  - Projects:
      - Overview: projects/index.md

  - Purple Team Lab:
      - Lab Overview: lab/index.md

  - Detection Engineering:
      - Detection Library: detections/index.md

  - Research:
      - Blog: blog/index.md

  - About: about.md
  - Contact: contact.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  generator: false